<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #comp { position: relative; overflow: hidden; transform-origin: center center; flex-shrink: 0; }
    .pv-clip { position: absolute; }
    .pv-media { inset: 0; width: 100%; height: 100%; }
    .pv-textwrap { left: 0; width: 100%; text-align: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"><div id="comp"></div></div>
  <script src="preview-runtime.js"></script>
</body>
</html>
